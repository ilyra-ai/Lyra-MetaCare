# Runtime reproduzível: o Node.js oficial do projeto é o fixado em .nvmrc e
# .node-version (linha 24 LTS); a instalação falha fora do intervalo do campo
# `engines` do package.json, inclusive para dependências.
engineStrict: true

allowBuilds:
  '@sentry/cli': true
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true

# Compatibilidade declarada e verificada: o eslint-config-next 16.3.8 depende
# de eslint-plugin-react 7.37, eslint-plugin-import 2.32 e
# eslint-plugin-jsx-a11y 6.10, que ainda não listam o ESLint 10 nos peers.
# O ESLint 9 está em fim de vida (2026-08-06); os plugins rodam no ESLint 10
# por meio do fixupConfigRules (@eslint/compat) em eslint.config.mjs, com
# `pnpm check:lint` executado e aprovado.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-react>eslint: '10'
    eslint-plugin-import>eslint: '10'
    eslint-plugin-jsx-a11y>eslint: '10'

# Correções de segurança em dependências transitivas (`pnpm audit`,
# 2026-10-06). As versões corrigidas estão dentro do mesmo major que os pacotes
# pais declaram, mas a resolução existente as mantinha nas versões vulneráveis.
# Cada entrada só atinge as versões afetadas pelo aviso indicado.
overrides:
  # GHSA-3jxr-9vmj-r5cp e outros: ReDoS/DoS (minimatch do ESLint).
  brace-expansion@>=5.0.0 <5.0.12: ^5.0.12
  # GHSA-v2hh-gcrm-f6hx e outros: parsing de URI (ajv do webpack do Dyad).
  fast-uri@>=3.0.0 <3.1.8: ^3.1.8
  # GHSA-c83g-rgw3-j3cx e GHSA-73wf-gq98-2v4g (webpack e Babel do Sentry).
  browserslist@<4.28.7: ^4.28.7
  # GHSA-w5vr-8v7q-w6rv (dependência do browserslist).
  baseline-browser-mapping@>=2.0.0 <2.11.0: ^2.11.0
  # GHSA-68fv-2mgg-jv7q (postcss do Vite usado pelo Vitest).
  source-map-js@>=1.0.0 <1.2.2: ^1.2.2
