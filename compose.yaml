services:
  mysql:
    image: mysql:8.0.45
    container_name: lyra-metacare-mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: lyra_metacare
      MYSQL_USER: lyra
      MYSQL_PASSWORD: lyra_mysql_local_2026
      MYSQL_ROOT_PASSWORD: lyra_mysql_root_2026
    ports:
      - '${MYSQL_HOST_PORT:-3307}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          '127.0.0.1',
          '-uroot',
          '-plyra_mysql_root_2026',
        ]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
