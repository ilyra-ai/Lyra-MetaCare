# Configuração lida do `.env.local` (fonte única, gerado por `pnpm env:init`):
#   docker compose --env-file .env.local <comando>
# Os scripts `pnpm db:*` e os launchers já passam o --env-file.
services:
  mysql:
    # MySQL 9.7 LTS (tag `lts` oficial). Volumes criados em 8.0 precisam do
    # upgrade em etapas 8.0 → 8.4 → 9.7: `pnpm db:upgrade`. A autenticação é a
    # padrão caching_sha2_password (mysql_native_password foi removido no 9.x).
    image: mysql:9.7.2
    container_name: lyra-metacare-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?defina MYSQL_DATABASE no .env.local (pnpm env:init) e use docker compose --env-file .env.local}
      MYSQL_USER: ${MYSQL_USER:?defina MYSQL_USER no .env.local (pnpm env:init) e use docker compose --env-file .env.local}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?defina MYSQL_PASSWORD no .env.local (pnpm env:init) e use docker compose --env-file .env.local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD no .env.local (pnpm env:init) e use docker compose --env-file .env.local}
    ports:
      # Somente na interface local: o banco não fica exposto na rede.
      - '127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # Saudável somente quando o usuário da aplicação autentica via TCP no
      # banco da aplicação (o `mysqladmin ping` retorna sucesso até com
      # "Access denied"). As credenciais vêm do ambiente do próprio container
      # (`$$` evita a interpolação do Compose), sem aparecer no comando.
      test:
        - CMD-SHELL
        - MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u"$$MYSQL_USER" -D "$$MYSQL_DATABASE" --batch --skip-column-names -e 'SELECT 1' >/dev/null
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
      start_interval: 2s

volumes:
  mysql_data:
