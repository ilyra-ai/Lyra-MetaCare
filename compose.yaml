services:
  mysql:
    # MySQL 9.7 LTS (tag `lts` oficial). Volumes criados em 8.0 precisam do
    # upgrade em etapas 8.0 → 8.4 → 9.7: `pnpm db:upgrade`. A autenticação é a
    # padrão caching_sha2_password (mysql_native_password foi removido no 9.x).
    image: mysql:9.7.2
    container_name: lyra-metacare-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: lyra_metacare
      MYSQL_USER: lyra
      MYSQL_PASSWORD: lyra_mysql_local_2026
      MYSQL_ROOT_PASSWORD: lyra_mysql_root_2026
    ports:
      - '${MYSQL_HOST_PORT:-3307}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          '127.0.0.1',
          '-uroot',
          '-plyra_mysql_root_2026',
        ]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
